name: Node.js CI

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - package.json
      - package-lock.json
  merge_group:
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - package.json
      - package-lock.json

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
    - name: Checkout to Repository
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm

    - name: Install Dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Build
      run: npm run build

    - name: Test
      run: npm run test
